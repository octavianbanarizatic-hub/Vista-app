[package]
name = "vista"
version = "0.5.0"
description = "A personal YouTube player"
edition = "2021"

[lib]
name = "vista_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
urlencoding = "2"

# Desktop only: phones have one window and the system restores it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# yt-dlp with its own Python, and the native video player.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-vista-android = { path = "android-plugin" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
